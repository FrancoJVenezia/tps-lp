<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Buscar productos</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 40px 16px;
        font-family: system-ui, Segoe UI, Arial, sans-serif;
      }

      .card {
        max-width: 520px;
        margin: 0 auto;
        padding: 24px 28px;
        border-radius: 12px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.15);
      }

      .card h2 {
        margin: 0 0 18px;
      }

      fieldset {
        border: 1px solid;
        border-radius: 8px;
        padding: 10px 16px 2px;
        margin: 0 0 18px;
      }

      legend {
        padding: 0 6px;
        font-weight: 600;
      }

      .campo {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 14px;
      }

      .campo input, .campo select, .campo textarea {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid;
        border-radius: 6px;
        font: inherit;
      }

      .campo textarea {
        min-height: 80px;
        resize: vertical;
      }

      .campo:has(input[type="checkbox"]) {
        flex-direction: row;
        align-items: center;
      }

      .campo input[type="checkbox"] {
        width: auto;
        margin: 0;
      }

      .fila {
        display: flex;
        gap: 16px;
      }

      .fila .campo {
        flex: 1;
        min-width: 0;
      }

      .ayuda {
        font-size: 0.85em;
        opacity: 0.8;
      }

      button {
        padding: 10px 22px;
        border: none;
        border-radius: 6px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      /* colores del tema (generados por el LLM) */
      body {
        background-color: #f7f7f7;
      }

      .card {
        background-color: #ffffff;
        border-color: #d3d3d3;
      }

      .card h2 {
        color: #333333;
      }

      fieldset {
        background-color: #ffffff;
        border-color: #d3d3d3;
      }

      legend {
        color: #333333;
      }

      .campo input {
        background-color: #ffffff;
        border-color: #d3d3d3;
      }

      .campo select {
        background-color: #ffffff;
        border-color: #d3d3d3;
      }

      .campo textarea {
        background-color: #ffffff;
        border-color: #d3d3d3;
      }

      .ayuda {
        color: #333333;
      }

      button {
        background-color: #444444;
        border-color: #444444;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <form class="card tema-claro" method="get" action="/buscar">
      <h2>Buscar productos</h2>
      <div class="fila">
        <div class="campo">
          <label for="producto">Producto</label>
          <input type="text" id="producto" name="producto" placeholder="Ej: auriculares">
        </div>
        <div class="campo">
          <label for="categoria">Categoría</label>
          <select id="categoria" name="categoria">
            <option value="Todas">Todas</option>
            <option value="Audio">Audio</option>
            <option value="Computación">Computación</option>
          </select>
        </div>
      </div>
      <div class="fila">
        <div class="campo">
          <label for="precio_minimo">Precio mínimo</label>
          <input type="number" id="precio_minimo" name="precio_minimo" min="0">
        </div>
        <div class="campo">
          <label for="precio_maximo">Precio máximo</label>
          <input type="number" id="precio_maximo" name="precio_maximo" min="0">
        </div>
      </div>
      <button type="submit">Buscar</button>
    </form>
  </body>
</html>
