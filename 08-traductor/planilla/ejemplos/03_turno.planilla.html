<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Pedir turno</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 40px 16px;
        font-family: system-ui, Segoe UI, Arial, sans-serif;
      }

      .card {
        max-width: 520px;
        margin: 0 auto;
        padding: 24px 28px;
        border-radius: 12px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.15);
      }

      .card h2 {
        margin: 0 0 18px;
      }

      fieldset {
        border: 1px solid;
        border-radius: 8px;
        padding: 10px 16px 2px;
        margin: 0 0 18px;
      }

      legend {
        padding: 0 6px;
        font-weight: 600;
      }

      .campo {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 14px;
      }

      .campo input, .campo select, .campo textarea {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid;
        border-radius: 6px;
        font: inherit;
      }

      .campo textarea {
        min-height: 80px;
        resize: vertical;
      }

      .campo:has(input[type="checkbox"]) {
        flex-direction: row;
        align-items: center;
      }

      .campo input[type="checkbox"] {
        width: auto;
        margin: 0;
      }

      .fila {
        display: flex;
        gap: 16px;
      }

      .fila .campo {
        flex: 1;
        min-width: 0;
      }

      .ayuda {
        font-size: 0.85em;
        opacity: 0.8;
      }

      .campo:has([required]) label::after {
        content: " *";
        color: #e03131;
      }

      button {
        padding: 10px 22px;
        border: none;
        border-radius: 6px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      /* letras y líneas del tema (fijas) */
      body, .card {
        color: #1f2937;
      }

      .card h2, legend {
        color: #1d4ed8;
      }

      fieldset, .campo input, .campo select, .campo textarea {
        border-color: #3b82f6;
        color: #1f2937;
      }

      .ayuda {
        color: #4b5563;
      }

      button {
        color: #ffffff;
      }

      /* fondos del tema (generados por el LLM) */
      body {
        background-color: #f2f2f2;
      }

      .card {
        background-color: #ffffff;
      }

      .campo input {
        background-color: #f7f7f7;
      }

      .campo select {
        background-color: #f7f7f7;
      }

      .campo textarea {
        background-color: #f7f7f7;
      }

      button {
        background-color: #1a1d23;
      }
    </style>
  </head>
  <body>
    <form class="card tema-azul" method="post" action="api/turnos">
      <h2>Pedir turno</h2>
      <fieldset>
        <legend>Paciente</legend>
        <div class="fila">
          <div class="campo">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required>
          </div>
          <div class="campo">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido" required>
          </div>
        </div>
        <div class="fila">
          <div class="campo">
            <label for="dni">DNI</label>
            <input type="number" id="dni" name="dni" required>
          </div>
          <div class="campo">
            <label for="fecha_de_nacimiento">Fecha de nacimiento</label>
            <input type="date" id="fecha_de_nacimiento" name="fecha_de_nacimiento">
          </div>
        </div>
      </fieldset>
      <fieldset>
        <legend>Turno</legend>
        <div class="campo">
          <label for="especialidad">Especialidad</label>
          <select id="especialidad" name="especialidad" required>
            <option value="Clínica">Clínica</option>
            <option value="Pediatría">Pediatría</option>
            <option value="Traumatología">Traumatología</option>
          </select>
        </div>
        <div class="campo">
          <label for="dia_preferido">Día preferido</label>
          <input type="date" id="dia_preferido" name="dia_preferido" required>
        </div>
        <div class="campo">
          <label for="motivo">Motivo</label>
          <textarea id="motivo" name="motivo" placeholder="Contanos brevemente"></textarea>
          <small class="ayuda">Opcional</small>
        </div>
      </fieldset>
      <button type="submit">Pedir turno</button>
    </form>
  </body>
</html>
