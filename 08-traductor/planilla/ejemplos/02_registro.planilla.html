<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Registro</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 40px 16px;
        font-family: system-ui, Segoe UI, Arial, sans-serif;
      }

      .card {
        max-width: 520px;
        margin: 0 auto;
        padding: 24px 28px;
        border-radius: 12px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.15);
      }

      .card h2 {
        margin: 0 0 18px;
      }

      fieldset {
        border: 1px solid;
        border-radius: 8px;
        padding: 10px 16px 2px;
        margin: 0 0 18px;
      }

      legend {
        padding: 0 6px;
        font-weight: 600;
      }

      .campo {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 14px;
      }

      .campo input, .campo select, .campo textarea {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid;
        border-radius: 6px;
        font: inherit;
      }

      .campo textarea {
        min-height: 80px;
        resize: vertical;
      }

      .campo:has(input[type="checkbox"]) {
        flex-direction: row;
        align-items: center;
      }

      .campo input[type="checkbox"] {
        width: auto;
        margin: 0;
      }

      .fila {
        display: flex;
        gap: 16px;
      }

      .fila .campo {
        flex: 1;
        min-width: 0;
      }

      .ayuda {
        font-size: 0.85em;
        opacity: 0.8;
      }

      .campo:has([required]) label::after {
        content: " *";
        color: #e03131;
      }

      button {
        padding: 10px 22px;
        border: none;
        border-radius: 6px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      /* colores del tema (generados por el LLM) */
      body {
        background-color: #333333;
      }

      .card {
        background-color: #444444;
      }

      .card h2 {
        color: #ffffff;
      }

      fieldset {
        background-color: #444444;
      }

      legend {
        color: #ffffff;
      }

      .campo input {
        background-color: #444444;
        border-color: #666666;
        color: #ffffff;
      }

      .campo select {
        background-color: #444444;
        border-color: #666666;
        color: #ffffff;
      }

      .campo textarea {
        background-color: #444444;
        border-color: #666666;
        color: #ffffff;
      }

      .ayuda {
        color: #ffffff;
      }

      button {
        background-color: #666666;
        border-color: #999999;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <form class="card tema-oscuro" method="post" action="api/registro">
      <h2>Registro</h2>
      <fieldset>
        <legend>Datos personales</legend>
        <div class="campo">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">
        </div>
        <div class="campo">
          <label for="edad">Edad</label>
          <input type="number" id="edad" name="edad" min="18" max="99" oninvalid="this.setCustomValidity('Tenés que ser mayor de edad')" oninput="this.setCustomValidity('')">
        </div>
      </fieldset>
      <fieldset>
        <legend>Cuenta</legend>
        <div class="campo">
          <label for="correo">Correo</label>
          <input type="email" id="correo" name="correo" required>
        </div>
        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" required>
          <small class="ayuda">Mínimo 8 caracteres</small>
        </div>
        <div class="campo">
          <input type="checkbox" id="acepto_los_terminos" name="acepto_los_terminos" required>
          <label for="acepto_los_terminos">Acepto los términos</label>
        </div>
      </fieldset>
      <button type="submit">Crear cuenta</button>
    </form>
  </body>
</html>
